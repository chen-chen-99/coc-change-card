# 部署到自己的服务器（VPS）时的 Nginx 配置示例
# 1) 把 dist/ 目录内容上传到服务器，例如 /var/www/buluochongtu
# 2) 将本文件放入 /etc/nginx/conf.d/buluochongtu.conf（替换域名）
# 3) nginx -t 检查配置，systemctl reload nginx
server {
    listen 80;
    server_name your-domain.com;   # 换成你的域名；没有域名可留空用 IP 访问

    root /var/www/buluochongtu;    # dist 内容所在目录
    index index.html;

    # 带 hash 的静态资源可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 可选：开启 gzip
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}